<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Predict | AI FreshCheck</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <div class="brand">AI FreshCheck</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="predict.html">Predict</a>
        <a href="history.html">History</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="model.html">Model</a>
      </nav>
    </div>
  </header>

  <main class="container page-shell">
    <section class="card form-card">
      <h2>Predict Freshness</h2>
      <form id="predict-form">
        <input type="file" id="image-input" accept="image/*" />
        <div class="cta-row">
          <button type="submit" class="btn btn-primary">Analyze Image</button>
          <button type="button" class="btn btn-secondary" id="camera-button">Use Camera</button>
        </div>
      </form>

      <div id="camera-container" class="camera-box hidden">
        <video id="camera-preview" autoplay playsinline></video>
        <div class="cta-row">
          <button type="button" class="btn btn-primary" id="capture-button">Capture</button>
          <button type="button" class="btn btn-secondary" id="retake-button">Retake</button>
        </div>
      </div>

      <div id="result" class="result-box hidden">
        <img id="uploaded-image" alt="Uploaded preview" />
        <div class="result-body">
          <h3>Prediction Result</h3>
          <p><strong>Produce:</strong> <span id="produce-name">-</span></p>
          <p><strong>Freshness:</strong> <span id="freshness-value">-</span></p>
          <p><strong>Confidence:</strong> <span id="confidence-value">-</span></p>
          <p id="message-box"></p>
        </div>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
